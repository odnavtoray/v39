{% extends "base.html" %}{% block content %}
<div class="authpage"><section class="authcard">
<h1>{% if lang=="ru" %}Восстановление пароля{% else %}Відновлення пароля{% endif %}</h1>
<form method="post" class="authform">
<label>{% if lang=="ru" %}Электронная почта{% else %}Електронна пошта{% endif %}
<input type="email" name="email" id="forgotEmail" autocomplete="email" required></label>
<div class="code-row">
<label>{% if lang=="ru" %}Код из письма{% else %}Код із листа{% endif %}<input name="code" inputmode="numeric" required></label>
<button type="button" class="outline" id="sendForgotEmailCode">{% if lang=="ru" %}Получить код{% else %}Отримати код{% endif %}</button>
</div>
<small id="forgotEmailCodeStatus" class="muted"></small>
<label>{% if lang=="ru" %}Новый пароль{% else %}Новий пароль{% endif %}
<span class="password-wrap"><input type="password" name="password" id="forgotPassword" minlength="6" required><button type="button" class="password-eye" data-password-toggle="forgotPassword" aria-label="show password">◉</button></span></label>
<label>{% if lang=="ru" %}Повторите пароль{% else %}Повторіть пароль{% endif %}
<span class="password-wrap"><input type="password" name="confirm" id="forgotConfirm" minlength="6" required><button type="button" class="password-eye" data-password-toggle="forgotConfirm" aria-label="show password">◉</button></span></label>
<button class="primary">{% if lang=="ru" %}Сохранить новый пароль{% else %}Зберегти новий пароль{% endif %}</button>
</form>
</section></div>
{% endblock %}
